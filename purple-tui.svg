<svg xmlns="http://www.w3.org/2000/svg" width="980" height="570" viewBox="0 0 980 570">
<style>
  .bg { fill:#0d1117; }
  .panel { fill:#11151d; stroke:#30363d; stroke-width:1; }
  .accent { fill:#a855f7; }
  .dim { fill:#7d8590; }
  .text { fill:#e6edf3; font: 14px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; }
  .small { font-size:12px; }
  .title { fill:#f0e7ff; font:bold 18px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
  .purple { fill:#c084fc; }
  .green { fill:#3fb950; }
  .line { stroke:#30363d; stroke-width:1; }
  .cursor { fill:#c084fc; animation: blink 1s steps(1,end) infinite; }
  @keyframes blink { 0%,48%{opacity:1} 49%,100%{opacity:0} }
  .boot1,.boot2,.boot3,.boot4,.app { opacity:0; }
  .boot1 { animation: show .01s 0.4s forwards; }
  .boot2 { animation: show .01s 1.1s forwards; }
  .boot3 { animation: show .01s 1.8s forwards; }
  .boot4 { animation: show .01s 2.5s forwards; }
  .app   { animation: show .25s 3.2s forwards; }
  @keyframes show { to { opacity:1 } }
</style>
<rect class="bg" width="980" height="570" rx="14"/>
<rect x="1" y="1" width="978" height="568" rx="14" fill="none" stroke="#30363d"/>
<circle cx="25" cy="24" r="6" fill="#ff5f56"/><circle cx="45" cy="24" r="6" fill="#ffbd2e"/><circle cx="65" cy="24" r="6" fill="#27c93f"/>
